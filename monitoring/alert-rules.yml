groups:
  - name: silentcomms-backend
    rules:
      - alert: BackendDown
        expr: up{job="silentcomms-backend"} == 0
        for: 1m
        labels:
          severity: critical
        annotations:
          summary: "SilentComms backend is unreachable"
          description: "Prometheus has not been able to scrape /metrics for 1 minute."

      - alert: HighErrorRate
        expr: |
          sum(rate(spacebar_http_request_total{status_code=~"5.."}[5m]))
          /
          sum(rate(spacebar_http_request_total[5m])) > 0.05
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "High 5xx error rate"
          description: "More than 5% of requests have returned 5xx errors over the last 5 minutes."

      - alert: HighRequestLatencyP99
        expr: histogram_quantile(0.99, sum(rate(spacebar_http_duration_bucket[5m])) by (le)) > 2
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "p99 request latency above 2s"
          description: "99th percentile response time has exceeded 2 seconds for 5 minutes."

# Metric names verified directly against src/util/monitoring/Monitoring.ts:
# spacebar_http_request_total (counter, labels: path/method/status_code)
# spacebar_http_duration (histogram, same labels)
